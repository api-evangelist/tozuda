aid: tozuda
name: Tozuda
description: Tozuda is a Philadelphia-based safety technology company that makes mechanical,
  non-electronic head impact indicators for helmets. The patented indicator changes from
  clear to red when a helmet sustains force exceeding a set G-force threshold, making
  hidden helmet damage visible to workers, athletes, and safety inspectors across ANSI,
  DOT, EN, CSA, CPSC, and SNELL helmet types. Tozuda is a Techstars portfolio company
  and does not currently publish a public API or developer program.
